  <div class="main7">
    <div class="booking-box">
      <h1>Book a Room</h1>
      <p>Reserve your room with us</p>

      <form>
        <input type="text" placeholder="Enter your name" autofocus>
        <br>
        <input type="number" placeholder="Enter your phone">
        <br>
        <input type="datetime-local">
        <br>

        <select>
          <option value="">Select number of guests</option>
          <option value="1">1 Person</option>
          <option value="2">2 People</option>
          <option value="3">3 People</option>
          <option value="4">4 People</option>
          <option value="5">5 People</option>
          <option value="6">6 People</option>
          <option value="7">7 People</option>
          <option value="8">8 People</option>
        </select>

        <br>

        <select>
          <option value="">Select Room</option>
          <option value="deluxe">Royal Deluxe Room</option>
          <option value="executive">Executive Room</option>
          <option value="ocean">Premium Ocean View</option>
          <option value="triple">Triple Deluxe Room</option>
          <option value="family">Family Room</option>
          <option value="suite">Royal Family Suite</option>
        </select>
        <br>
        <button type="submit">Book Now</button>
      </form>
    </div>
  </div>
